[project]
name = "pa-core"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "structlog>=26.1",
    "typer>=0.27",
    # One HTTP stack for source fetching, local inference, and Telegram.
    "httpx2>=2.12",
    "keyring>=25.7",
]

[project.scripts]
pa-core-admin = "pa_core.cli:app"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"
